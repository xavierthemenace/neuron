name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, curriculum, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Node 24: the unit tests import lib/*.ts directly and rely on Node's
      # built-in TypeScript type stripping, as scripts/bake-layout.mjs does.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npx tsc --noEmit
      # The curriculum is treated like code: an incomplete node, a dangling
      # edge, a prerequisite cycle or an evidence band stronger than its
      # pillars allow fails the build rather than shipping.
      - name: Curriculum and layout integrity
        run: npm run check:data
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    name: Browser regression, accessibility and visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The browser suite runs against a production build on purpose: `next dev`
      # double-invokes effects and skips minification, so a test that only
      # passes there is not protecting what users actually run.
      - name: Build
        run: npm run build
      - name: Run browser suite
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
