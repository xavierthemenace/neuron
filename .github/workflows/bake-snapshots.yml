name: Bake visual baselines

# Visual baselines are per-platform: glyph rasterisation differs between the
# Linux CI runner and a developer machine, so `snapshotPathTemplate` keeps a
# directory per `process.platform`. A developer can regenerate their own set
# locally with `npm run test:e2e:update`, but nobody can produce the Linux set
# from a Mac or a Windows box — hence this workflow.
#
# Run it from the Actions tab (or `gh workflow run bake-snapshots.yml`) after a
# deliberate visual change. It uploads the regenerated baselines as an artifact
# rather than committing them, so the diff is reviewed like any other change.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to bake against
        required: false
        default: main

permissions:
  contents: read

jobs:
  bake:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Same production build the browser suite runs against, so the baked
      # baselines match what CI will later compare.
      - name: Build
        run: npm run build
      # `--update-snapshots` rewrites baselines and still reports the run as
      # passing, so the step is expected to succeed even when images changed.
      - name: Regenerate baselines
        run: npx playwright test --update-snapshots
      - name: Show what changed
        run: git status --short e2e/__screenshots__
      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: linux-baselines
          path: e2e/__screenshots__/linux/
          if-no-files-found: error
          retention-days: 7
